serenity {
    browser.maximized = true
    serenity.report.locale=es
    serenity.project.name = "prueba tecnica"
    serenity.requirements.dir = "src/test/resources/features"
    serenity.take.screenshots = BEFORE_AND_AFTER_EACH_STEP
    webdriver {
        driver = firefox
    }

    chrome {
      preferences {
        credentials_enable_service = false
        profile.password_manager_enabled = false
        profile.password_manager_leak_detection = false

        autofill.profile_enabled = false
        autofill.credit_card_enabled = false

        profile.default_content_setting_values.notifications = 2
      }

      switches = [
        "--start-maximized",
        "--disable-notifications",
        "--disable-infobars",
        "--disable-extensions",
        "--incognito"
      ]
    }

    firefox {
      preferences {
        "signon.rememberSignons" = false
        "signon.autofillForms" = false
        "signon.management.page.breach-alerts.enabled" = false
        "signon.generation.enabled" = false
        "signon.storeWhenAutocompleteOff" = false

        "dom.webnotifications.enabled" = false
        "dom.push.enabled" = false

        "browser.shell.checkDefaultBrowser" = false
      }

      switches = [
        "-private"
      ]
    }

    capabilities {
        acceptInsecureCerts = true
    }
}

pages{
      base.url= "https://www.saucedemo.com/"
}
